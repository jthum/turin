[package]
name = "anthropic-sdk"
version = "0.7.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
inference-sdk-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
eventsource-stream = "0.2"
bon = "3.8.2"

[dev-dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std"] }
dotenvy = "0.15"
wiremock = "0.6.5"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "time"] }
