[package]
name = "inference-sdk-core"
version = "0.7.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["time"] }
thiserror = "1.0"
tracing = "0.1"
futures-core = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bon = "3.8.2"

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "time"] }
proptest = "1.6"
