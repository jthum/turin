[package]
name = "turin-manager"
version = "0.27.0"
edition = "2024"
description = "Setup, install, and configuration helper for Turin"

[[bin]]
name = "turin-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
dialoguer = "0.12"
dotenvy = "0.15"
qr2term = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
toml = "0.8"
toml_edit = "0.22"
turin-channel-core = { path = "../turin-channel-core" }
turin-channel-host = { path = "../turin-channel-host" }
turin-control-client = { path = "../turin-control-client" }
turin-types = { path = "../turin-types" }

[dev-dependencies]
tempfile = "3.10"
