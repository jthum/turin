[governance]
enforcement_enabled = true
unmatched_capability = "deny"

[governance.audit]
mode = "observational"
include_capability_context = false

[governance.import]
mode = "mixed"
allow_unscoped_in_open = false

[governance.capabilities]
"runtime.db.*" = true
"runtime.agent.*" = true
"runtime.graph.*" = true
"runtime.code.search.*" = true
"runtime.schedule.*" = true
"runtime.worklist.*" = true
"runtime.plan.*" = true
"runtime.policy.set" = true
"runtime.governance.grant.*" = true
"harness.import.*" = true
"harness.use.*" = true
"fs.*" = true
"web.*" = true
"memory.*" = true
"shell.exec" = false
"integration.mcp.*" = false
