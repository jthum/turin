[package]
name = "turin-channel-whatsapp"
version = "0.27.0"
edition = "2024"

[[bin]]
name = "turin-channel-whatsapp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
turin-channel-core = { path = "../turin-channel-core" }
turin-channel-runner = { path = "../turin-channel-runner" }
turin-daemon-client = { path = "../turin-daemon-client" }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }
whatsapp-rust = { version = "0.5.0", default-features = false, features = ["sqlite-storage", "tokio-runtime", "tokio-transport", "ureq-client", "tokio-native", "signal"] }
whatsapp-rust-tokio-transport = "0.5.0"
whatsapp-rust-ureq-http-client = "0.5.0"

[dev-dependencies]
tempfile = "3.10"
