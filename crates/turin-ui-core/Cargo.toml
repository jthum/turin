[package]
name = "turin-ui-core"
version = "0.27.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
turin-control-client = { path = "../turin-control-client" }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }
turin-types = { path = "../turin-types" }

[dev-dependencies]
tempfile = "3.10"
