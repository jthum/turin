[package]
name = "turin-channel-fs"
version = "0.27.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["fs", "macros", "rt", "signal", "time", "sync"] }
uuid = { version = "1.0", features = ["v7"] }
tracing = "0.1"
turin-channel-core = { path = "../turin-channel-core" }
turin-channel-runner = { path = "../turin-channel-runner" }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
