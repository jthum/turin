[package]
name = "turin-channel-telegram-runner"
version = "0.26.0"
edition = "2024"
description = "External Telegram channel runner for Turin"

[[bin]]
name = "turin-channel-telegram-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
turin-channel-runner = { path = "../turin-channel-runner" }
turin-channel-telegram = { path = "../turin-channel-telegram" }
turin-daemon-client = { path = "../turin-daemon-client" }
