[package]
name = "turin-cli"
version = "0.30.1"
edition = "2024"
description = "Command-line product composition for Turin"

[features]
default = []
heap-profile = ["dep:dhat"]
perf-diagnostics = ["turin/perf-diagnostics"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
dhat = { version = "0.3", optional = true }
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs", "signal", "net"] }
tracing = "0.1.44"
turin = { path = "../..", default-features = false }
turin-daemon-client = { path = "../turin-daemon-client" }
turin-harness-lua = { path = "../turin-harness-lua" }
turin-local-ipc = { path = "../turin-local-ipc" }
turin-types = { path = "../turin-types" }
uuid = { version = "1.0", features = ["v4"] }

[[bin]]
name = "turin"
path = "src/main.rs"

[[bin]]
name = "turin-remote"
path = "src/bin/turin_remote.rs"

[dev-dependencies]
tempfile = "3.27"
