[package]
name = "turin-code-index"
version = "0.27.0"
edition = "2024"
description = "Shared Turin code-index reader and support primitives"

[lib]
name = "turin_code_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
turso = { version = "0.6", default-features = false }
turso_core = { version = "0.6", features = ["fts"] }
turin-types = { path = "../turin-types" }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
turin-code-index-writer = { path = "../turin-code-index-writer" }
