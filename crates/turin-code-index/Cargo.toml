[package]
name = "turin-code-index"
version = "0.26.0"
edition = "2024"
description = "Shared Turin code-index reader and writer primitives"

[lib]
name = "turin_code_index"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
turso = { version = "0.5", default-features = false }
turso_core = { version = "0.5", features = ["fts"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
