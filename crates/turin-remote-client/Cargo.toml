[package]
name = "turin-remote-client"
version = "0.27.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["time"] }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
