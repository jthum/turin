[package]
name = "turin-channel-discord"
version = "0.31.0"
edition = "2024"

[[bin]]
name = "turin-channel-discord"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
turin-channel-core = { path = "../turin-channel-core" }
turin-channel-runner = { path = "../turin-channel-runner" }
turin-daemon-client = { path = "../turin-daemon-client" }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
