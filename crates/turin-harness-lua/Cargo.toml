[package]
name = "turin-harness-lua"
version = "0.30.1"
edition = "2024"
description = "Lua harness runtime adapter for Turin"

[features]
default = ["lua"]
lua = []

[dependencies]
turin-core = { package = "turin", path = "../..", default-features = false }
anyhow = "1.0"
futures = "0.3"
mlua = { version = "0.12", features = ["luau", "serialize", "async", "macros", "send"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.0", default-features = false, features = ["rt-multi-thread", "time", "sync", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1.44"
turso = { version = "0.7.2", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.0", features = ["v4", "v7"] }
turin-code-index = { path = "../turin-code-index" }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }
turin-types = { path = "../turin-types" }

[dev-dependencies]
tempfile = "3.27"
