[package]
name = "turin-daemon-client"
version = "0.21.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", default-features = false, features = ["io-util", "net", "fs"] }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
