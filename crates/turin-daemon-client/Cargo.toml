[package]
name = "turin-daemon-client"
version = "0.23.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.0", default-features = false, features = ["io-util", "net", "fs", "time"] }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }
turin-local-ipc = { path = "../turin-local-ipc" }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
