[package]
name = "turin-web"
version = "0.31.0"
edition = "2024"

[[bin]]
name = "turin-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
http-body-util = "0.1"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.44"
turin-client = { path = "../turin-client" }
turin-types = { path = "../turin-types" }

[dev-dependencies]
tempfile = "3.10"
