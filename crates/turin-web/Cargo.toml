[package]
name = "turin-web"
version = "0.27.0"
edition = "2024"
description = "Helper binary for Turin web fetch and web search tools"

[[bin]]
name = "turin-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
http = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "query", "rustls"] }
scraper = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "io-util"] }
turin-types = { path = "../turin-types" }
url = "2.5"
