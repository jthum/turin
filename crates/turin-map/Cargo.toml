[package]
name = "turin-map"
version = "0.25.0"
edition = "2024"
description = "Build and inspect Turin code-search indexes"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
inference-sdk-core = { git = "https://github.com/jthum/inference-sdk-rust", rev = "445b269d797aadb16d69a1caf6d4841bec36b415" }
inference-sdk-registry = { git = "https://github.com/jthum/inference-sdk-rust", rev = "445b269d797aadb16d69a1caf6d4841bec36b415" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
toml = "0.8"
turin-code-index = { path = "../turin-code-index" }
