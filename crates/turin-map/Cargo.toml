[package]
name = "turin-map"
version = "0.30.1"
edition = "2024"
description = "Build and inspect Turin code-search indexes"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
inference-sdk-core = { git = "https://github.com/jthum/inference-sdk-rust", rev = "fe38ccb15119e7108ee3a4fe725435e53a39056c" }
inference-sdk-registry = { git = "https://github.com/jthum/inference-sdk-rust", rev = "fe38ccb15119e7108ee3a4fe725435e53a39056c" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
toml = "1.1"
turin-code-index = { path = "../turin-code-index" }
turin-code-index-writer = { path = "../turin-code-index-writer" }
turin-types = { path = "../turin-types" }
