[package]
name = "turin-code-index-writer"
version = "0.27.0"
edition = "2024"
description = "Turin code-index write and rebuild primitives"

[lib]
name = "turin_code_index_writer"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
turso = { version = "0.7.2", default-features = false }
turso_core = { version = "0.7.2", features = ["fts"] }
turin-code-index = { path = "../turin-code-index" }
turin-types = { path = "../turin-types" }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
