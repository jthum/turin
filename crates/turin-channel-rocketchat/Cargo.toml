[package]
name = "turin-channel-rocketchat"
version = "0.26.0"
edition = "2024"

[[bin]]
name = "turin-channel-rocketchat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
turin-channel-core = { path = "../turin-channel-core" }
turin-channel-runner = { path = "../turin-channel-runner" }
turin-daemon-client = { path = "../turin-daemon-client" }
turin-daemon-protocol = { path = "../turin-daemon-protocol" }

[dev-dependencies]
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread"] }
