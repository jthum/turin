[workspace]
members = [
    "crates/turin-types",
    "crates/turin-local-ipc",
    "crates/turin-daemon-protocol",
    "crates/turin-daemon-client",
    "crates/turin-remote-client",
    "crates/turin-control-client",
    "crates/turin-ui-core",
    "crates/turin-channel-core",
    "crates/turin-channel-runner",
    "crates/turin-channel-fs",
    "crates/turin-channel-discord",
    "crates/turin-channel-rocketchat",
    "crates/turin-channel-telegram",
    "crates/turin-channel-whatsapp",
    "crates/turin-manager",
    "crates/turin-code-index",
    "crates/turin-code-index-writer",
    "crates/turin-map",
    "crates/turin-tui",
    "crates/turin-app",
]
resolver = "2"

[package]
name = "turin"
version = "0.27.0"
edition = "2024"
description = "An event-driven LLM execution runtime with composable Lua harness scripts and auto-managed channel sidecars"

[[bin]]
name = "turin"
path = "src/main.rs"

[[bin]]
name = "turin-remote"
path = "src/bin/turin_remote.rs"

[lib]
name = "turin"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"
turin-types = { path = "crates/turin-types" }
turin-local-ipc = { path = "crates/turin-local-ipc" }
turin-daemon-protocol = { path = "crates/turin-daemon-protocol" }
turin-daemon-client = { path = "crates/turin-daemon-client" }
turin-channel-core = { path = "crates/turin-channel-core" }
turin-channel-runner = { path = "crates/turin-channel-runner" }
turin-channel-fs = { path = "crates/turin-channel-fs" }
turin-code-index = { path = "crates/turin-code-index" }

# Inference SDK family (unified provider layer)
inference-sdk-core = { git = "https://github.com/jthum/inference-sdk-rust", rev = "445b269d797aadb16d69a1caf6d4841bec36b415" }
inference-sdk-registry = { git = "https://github.com/jthum/inference-sdk-rust", rev = "445b269d797aadb16d69a1caf6d4841bec36b415" }
openai-sdk = { git = "https://github.com/jthum/inference-sdk-rust", rev = "445b269d797aadb16d69a1caf6d4841bec36b415" }

# MCP SDK
mcp-sdk = { git = "https://github.com/jthum/mcp-sdk-rust", rev = "3c5e0d3078f68d020d1617f3bac2b447bb9df478" }

# Streaming
futures = "0.3"
similar = "2.7"
sha2 = "0.10"

# Async trait support
async-trait = "0.1"

# Unique IDs
uuid = { version = "1.0", features = ["v4", "v7"] }
notify = "6.1"
dotenvy = "0.15"

# REPL
rustyline = "14.0"


# Database (Turso — pure Rust SQLite rewrite)
turso = { version = "0.5", default-features = false }
turso_core = { version = "0.5", features = ["fts"] }

# Lua harness engine (Luau dialect with sandboxing)
mlua = { version = "0.11", features = ["luau", "serialize", "async", "macros", "send"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter", "ansi", "json"] }
tracing-appender = "0.2.4"
base64 = "0.22"
bytes = "1.0"
http = "1.0"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
sha1 = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "query", "rustls"] }
scraper = "0.23"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "query", "stream", "rustls"] }
turin-daemon-client = { path = "crates/turin-daemon-client" }
turin-daemon-protocol = { path = "crates/turin-daemon-protocol" }
turin-local-ipc = { path = "crates/turin-local-ipc" }
turin-channel-core = { path = "crates/turin-channel-core" }
turin-channel-runner = { path = "crates/turin-channel-runner" }
turin-channel-fs = { path = "crates/turin-channel-fs" }
turin-channel-discord = { path = "crates/turin-channel-discord" }
turin-channel-telegram = { path = "crates/turin-channel-telegram" }
turin-code-index-writer = { path = "crates/turin-code-index-writer" }

[profile.dev]
debug = 0         # Lower compile memory and artifact size during normal iteration
incremental = true

[profile.test]
debug = 0         # Tests do not need full debuginfo by default
incremental = true

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel codegen to improve optimization
panic = "abort"     # Remove panic unwinding to save space
strip = true        # Automatically strip symbols from binary

[patch."https://github.com/jthum/inference-sdk-rust"]
inference-sdk-core = { path = "vendor/inference-sdk-rust/core" }
inference-sdk-registry = { path = "vendor/inference-sdk-rust/registry" }
openai-sdk = { path = "vendor/inference-sdk-rust/openai" }
anthropic-sdk = { path = "vendor/inference-sdk-rust/anthropic" }
