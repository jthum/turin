[workspace]
members = [
    "crates/turin-types",
    "crates/turin-daemon-protocol",
    "crates/turin-daemon-client",
    "crates/turin-channel-core",
    "crates/turin-channel-runner",
    "crates/turin-channel-fs",
    "crates/turin-channel-discord",
]
resolver = "2"

[package]
name = "turin"
version = "0.22.0"
edition = "2024"
description = "A single-binary, event-driven LLM execution runtime with composable Lua harness scripts"

[[bin]]
name = "turin"
path = "src/main.rs"

[[bin]]
name = "turin-map"
path = "src/bin/turin-map.rs"

[lib]
name = "turin"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"
turin-types = { path = "crates/turin-types" }
turin-daemon-protocol = { path = "crates/turin-daemon-protocol" }
turin-daemon-client = { path = "crates/turin-daemon-client" }
turin-channel-runner = { path = "crates/turin-channel-runner" }
turin-channel-fs = { path = "crates/turin-channel-fs" }
turin-channel-discord = { path = "crates/turin-channel-discord" }

# Inference SDK family (unified provider layer)
inference-sdk-core = { git = "https://github.com/jthum/inference-sdk-rust", rev = "bd64dd2f9fd7a58e8c4e270c8b931d13de2971c6" }
inference-sdk-registry = { git = "https://github.com/jthum/inference-sdk-rust", rev = "bd64dd2f9fd7a58e8c4e270c8b931d13de2971c6" }
openai-sdk = { git = "https://github.com/jthum/inference-sdk-rust", rev = "bd64dd2f9fd7a58e8c4e270c8b931d13de2971c6" }

# MCP SDK
mcp-sdk = { git = "https://github.com/jthum/mcp-sdk-rust", rev = "3c5e0d3078f68d020d1617f3bac2b447bb9df478" }

# Streaming
futures = "0.3"
ignore = "0.4"
similar = "2.7"
sha2 = "0.10"

# Async trait support
async-trait = "0.1"

# Unique IDs
uuid = { version = "1.0", features = ["v4", "v7"] }
notify = "6.1"

# REPL
rustyline = "14.0"


# Database (Turso — pure Rust SQLite rewrite)
turso = { version = "0.5", default-features = false }
turso_core = { version = "0.5", features = ["fts"] }

# Lua harness engine (Luau dialect with sandboxing)
mlua = { version = "0.11", features = ["luau", "serialize", "async", "macros", "send"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter", "ansi", "json"] }
tracing-appender = "0.2.4"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"
turin-daemon-client = { path = "crates/turin-daemon-client" }
turin-daemon-protocol = { path = "crates/turin-daemon-protocol" }
turin-channel-core = { path = "crates/turin-channel-core" }
turin-channel-runner = { path = "crates/turin-channel-runner" }
turin-channel-fs = { path = "crates/turin-channel-fs" }
turin-channel-discord = { path = "crates/turin-channel-discord" }

[profile.dev]
debug = 0         # Lower compile memory and artifact size during normal iteration
incremental = true

[profile.test]
debug = 0         # Tests do not need full debuginfo by default
incremental = true

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel codegen to improve optimization
panic = "abort"     # Remove panic unwinding to save space
strip = true        # Automatically strip symbols from binary
