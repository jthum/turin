[workspace]
members = [
    "crates/turin-cli",
    "crates/turin-harness-lua",
    "crates/turin-types",
    "crates/turin-local-ipc",
    "crates/turin-daemon-protocol",
    "crates/turin-daemon-client",
    "crates/turin-remote-client",
    "crates/turin-client",
    "crates/turin-ui-core",
    "crates/turin-web",
    "crates/turin-channel-core",
    "crates/turin-channel-host",
    "crates/turin-channel-runner",
    "crates/turin-channel-fs",
    "crates/turin-channel-discord",
    "crates/turin-channel-rocketchat",
    "crates/turin-channel-telegram",
    "crates/turin-channel-whatsapp",
    "crates/turin-manager",
    "crates/turin-code-index",
    "crates/turin-code-index-writer",
    "crates/turin-map",
    "crates/turin-tui",
    "crates/turin-app",
]
resolver = "2"

[package]
name = "turin"
version = "0.31.0"
edition = "2024"
description = "An event-driven runtime kernel for agentic applications"
autobins = false

[lib]
name = "turin"
path = "src/lib.rs"

[features]
default = []
perf-diagnostics = []

[dependencies]
# Config
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
turin-types = { path = "crates/turin-types" }
turin-local-ipc = { path = "crates/turin-local-ipc" }
turin-daemon-protocol = { path = "crates/turin-daemon-protocol" }
turin-daemon-client = { path = "crates/turin-daemon-client" }
turin-code-index = { path = "crates/turin-code-index" }

# Inference SDK family (unified provider layer)
inference-sdk-core = { git = "https://github.com/jthum/inference-sdk-rust", rev = "fe38ccb15119e7108ee3a4fe725435e53a39056c" }
inference-sdk-registry = { git = "https://github.com/jthum/inference-sdk-rust", rev = "fe38ccb15119e7108ee3a4fe725435e53a39056c" }
openai-sdk = { git = "https://github.com/jthum/inference-sdk-rust", rev = "fe38ccb15119e7108ee3a4fe725435e53a39056c" }

# MCP SDK
mcp-sdk = { git = "https://github.com/jthum/mcp-sdk-rust", rev = "3c5e0d3078f68d020d1617f3bac2b447bb9df478" }

# Streaming
futures = "0.3"
similar = "3.1"
sha2 = "0.11"

# Async trait support
async-trait = "0.1"

# Unique IDs
uuid = { version = "1.0", features = ["v4", "v7"] }
notify = "8.2"
dotenvy = "0.15"

# Database (Turso — pure Rust SQLite rewrite)
turso = { version = "0.7.2", default-features = false }
turso_core = { version = "0.7.2", features = ["fts"] }

tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter", "ansi", "json"] }
tracing-appender = "0.2.4"
libc = "0.2"
base64 = "0.23"
bytes = "1.0"
http = "1.0"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
sha1 = "0.11"
tokio-tungstenite = { version = "0.30", default-features = false }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "query", "rustls", "stream"] }
scraper = "0.27"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[profile.dev]
debug = 0         # Lower compile memory and artifact size during normal iteration
incremental = true

[profile.test]
debug = 0         # Tests do not need full debuginfo by default
incremental = true

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel codegen to improve optimization
panic = "abort"     # Remove panic unwinding to save space
strip = true        # Automatically strip symbols from binary

[profile.profiling]
inherits = "release"
debug = 1
strip = false
