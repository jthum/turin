[package]
name = "turin-perf-suite"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
turin = { path = "../.." }
turin-channel-core = { path = "../../crates/turin-channel-core" }
turin-channel-runner = { path = "../../crates/turin-channel-runner" }
turin-daemon-client = { path = "../../crates/turin-daemon-client" }
turin-daemon-protocol = { path = "../../crates/turin-daemon-protocol" }
turso = { version = "0.6", default-features = false }
uuid = { version = "1.0", features = ["v7"] }
