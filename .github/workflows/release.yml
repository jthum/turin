name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_PACKAGES: >-
    -p turin-cli
    -p turin-map
    -p turin-manager
    -p turin-channel-discord
    -p turin-channel-telegram
    -p turin-channel-rocketchat
    -p turin-channel-whatsapp
  RELEASE_BINS: >-
    turin
    turin-remote
    turin-map
    turin-manager
    turin-channel-discord
    turin-channel-telegram
    turin-channel-rocketchat
    turin-channel-whatsapp

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run release validation
        run: scripts/prepush_ci.sh fmt check clippy test

  build-release-assets:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            name: macos
            archive: tar.gz
          - os: windows-latest
            name: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        shell: bash
        run: cargo build --release $RELEASE_PACKAGES

      - name: Verify release binaries
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi

          for bin in $RELEASE_BINS; do
            path="target/release/${bin}${suffix}"
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Release binary was not produced"
              exit 1
            fi
          done

      - name: Package release bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          for bin in $RELEASE_BINS; do
            cp "target/release/$bin" "dist/$bin"
          done
          tar -czf "turin-${{ matrix.name }}.tar.gz" -C dist $RELEASE_BINS

      - name: Package release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bins = $env:RELEASE_BINS -split '\s+' | Where-Object { $_ -ne '' }
          $paths = @()
          foreach ($bin in $bins) {
            $source = "target/release/$bin.exe"
            $dest = "dist/$bin.exe"
            Copy-Item $source $dest
            $paths += $dest
          }
          Compress-Archive -Path $paths -DestinationPath "turin-${{ matrix.name }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: turin-${{ matrix.name }}
          path: turin-${{ matrix.name }}.${{ matrix.archive }}

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: turin-${{ matrix.name }}.${{ matrix.archive }}
