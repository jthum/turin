[governance]
profile = "open"
enforcement_enabled = false
unmatched_capability = "allow"

[governance.audit]
mode = "off"
include_capability_context = false

[governance.import]
mode = "legacy"
allow_unscoped_in_open = true

[governance.capabilities]
"runtime.db.*" = true
"runtime.agent.*" = true
"runtime.graph.*" = true
"runtime.code.search.*" = true
"runtime.policy.set" = true
"runtime.governance.grant.*" = true
"harness.import.*" = true
"harness.use.*" = true
"fs.read" = true
"fs.write" = true
"shell.exec" = true
